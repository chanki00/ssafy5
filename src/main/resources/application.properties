# 애플리케이션 이름
spring.application.name=ssafy_5_Trip

# 서버 포트 (선택)
server.port=8080

# ==============================
# ✅ 데이터베이스 연결 설정
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/ssafy?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# ✅ JPA 설정
# ==============================
spring.jpa.hibernate.ddl-auto=update   # create / update / validate / none 중 선택
spring.jpa.show-sql=true        
spring.jpa.properties.hibernate.format_sql=true  # 쿼리 예쁘게 출력
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
